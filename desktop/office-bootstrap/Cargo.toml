[package]
name = "keyzapper-office-bootstrap"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bootstrap endpoint for Claude for Microsoft 365: validates Entra tokens and hands out per-profile gateway configuration from KeyZapper profiles."

[[bin]]
name = "keyzapper-office-bootstrap"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
jsonwebtoken = "9"
keyzapper-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ureq = { version = "3", default-features = false, features = ["native-tls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
http-body-util = "0.1"
rand = "0.8"
rsa = "0.9"
tower = { version = "0.5", features = ["util"] }
