# Vorgeschlagen von OpenReleasePilot: wöchentliche Updates für die erkannten Abhängigkeiten.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/desktop"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
